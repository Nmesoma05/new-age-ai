# Every pull request and every push to main. Nothing reaches staging unless all of this is green.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci-only-superuser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: ci-only-superuser
    defaults:
      run:
        working-directory: eco-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: eco-backend/requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt -r requirements-prod.txt moto[server]==5.0.28 pip-audit
      - name: Database roles (test-only passwords)
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE eco_owner LOGIN PASSWORD 'owner_dev_pw' CREATEDB" \
            -c "CREATE ROLE eco_app LOGIN PASSWORD 'app_dev_pw' NOBYPASSRLS"
          psql -h localhost -U postgres -d template1 -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: No secrets files committed
        working-directory: .
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          [ -z "$bad" ] || { echo "::error::committed env files: $bad"; exit 1; }
      - name: Lint
        run: ruff check --select F,I app tests migrations scripts
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.txt -r requirements-prod.txt
      - name: Migration chain has one head and is additive
        run: python -m scripts.migration_safety --since 0008_account_recovery
      - name: Tests (real Postgres with row-level security)
        run: python -m pytest -q
      - name: OpenAPI is current
        run: python scripts/export_openapi.py && git diff --exit-code docs/openapi.json

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: eco-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: eco-web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Dependency vulnerabilities (runtime deps, high and above)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  browser:
    needs: [backend, web]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci-only-superuser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: ci-only-superuser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          pip install -r eco-backend/requirements-dev.txt
          (cd eco-web && npm ci && npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium)
          psql -h localhost -U postgres -c "CREATE ROLE eco_owner LOGIN PASSWORD 'owner_dev_pw' CREATEDB" \
            -c "CREATE ROLE eco_app LOGIN PASSWORD 'app_dev_pw' NOBYPASSRLS"
          psql -h localhost -U postgres -d template1 -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Start API (real DB, scripted AI, fake providers) and web (production build)
        run: |
          (cd eco-backend && nohup python -m tests.e2e_server > ../api.log 2>&1 &)
          (cd eco-web && npm run build && API_URL=http://127.0.0.1:8000 PORT=3000 HOSTNAME=127.0.0.1 nohup npm run start:prod > ../web.log 2>&1 &)
          for i in $(seq 60); do curl -sf localhost:8000/health && curl -sf -o /dev/null localhost:3000/login && break; sleep 2; done
      - name: Browser suites (Creator, Business, Freelancer, Integrations, QA personas + a11y/CSP sweep)
        working-directory: eco-web
        run: for f in run business freelancer integrations personas; do node "e2e/$f.mjs"; done
      - name: Cross-tenant sweep over every route
        working-directory: eco-backend
        run: python -m tests.qa.idor_sweep
      - name: No server errors during the run
        run: |
          if grep -q Traceback api.log; then echo "::error::server errors during the browser run"; exit 1; fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: |
            eco-web/e2e/out
            api.log
            web.log

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, web, browser]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app == 'api' && 'eco-backend' || 'eco-web' }}
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/eco-${{ matrix.app }}:${{ github.sha }}
      - name: Image scan (fail on critical, fixable)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/eco-${{ matrix.app }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push the scanned image
        run: docker push "ghcr.io/${{ github.repository_owner }}/eco-${{ matrix.app }}:${{ github.sha }}"
