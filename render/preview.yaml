# Render Blueprint: PRIVATE PREVIEW of New Age AI (ENV=preview). Not staging, not production.
# Uploads and email are off, sign-up is limited to SIGNUP_ALLOWLIST, the API is not reachable from the internet
# (private service; only the web server talks to it). Render builds both images from this repo's Dockerfiles.
# Secrets: APP_DB_PASSWORD and JWT_SECRET are generated by Render; CREDENTIALS_ENCRYPTION_KEY, SIGNUP_ALLOWLIST and
# OPENAI_API_KEY are set at approval or on the service's Environment page. Nothing secret is in this file.
databases:
  - name: newage-db-preview
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"        # the tested version; Render's default is newer
    databaseName: newage
    ipAllowList: []                    # no access from the internet; private network only

services:
  - type: pserv                        # private: no public URL
    name: newage-api-preview
    runtime: docker
    dockerfilePath: ./eco-backend/Dockerfile
    dockerContext: ./eco-backend
    dockerCommand: python -m scripts.render_start   # create eco_app role, migrate, then run the API as eco_app
    region: frankfurt
    plan: starter
    numInstances: 1
    buildFilter:
      paths: [eco-backend/**]
    envVars:
      - key: ENV
        value: preview
      - key: PORT
        value: "8000"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: LOG_FORMAT
        value: json
      - key: OWNER_DATABASE_URL        # Render's default user = schema owner; used only by the start step
        fromDatabase: {name: newage-db-preview, property: connectionString}
      - key: APP_DB_PASSWORD           # password for the restricted eco_app role the API runs as
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: CREDENTIALS_ENCRYPTION_KEY  # Fernet key (urlsafe base64), not a generateValue
        sync: false
      - key: SIGNUP_ALLOWLIST          # JSON list of emails allowed to sign up
        sync: false
      - key: OPENAI_API_KEY            # empty = AI reports "not configured"; paste the key on the Environment page
        sync: false
      - key: PUBLIC_WEB_URL            # replaced with the web service's real onrender.com URL after creation
        value: https://newage-web-preview.onrender.com
      - key: TRUSTED_PROXIES           # the web server reaches us over Render's private network [verify range]
        value: '["10.0.0.0/8"]'
      - key: UPLOADS_ENABLED
        value: "false"
      - key: STORAGE_BACKEND
        value: local
      - key: FILE_SCANNER
        value: disabled_dev_only
      - key: EMAIL_BACKEND
        value: none
      - key: LEGAL_TERMS_VERSION
        value: preview-draft-2026-11
      - key: AI_PROVIDER
        value: openai
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_MODEL_PRICES           # USD per 1M tokens [input, output], OpenAI pricing page, 21 Nov 2026
        value: '{"gpt-4o-mini":[0.15,0.6]}'
      - key: AI_DAILY_BUDGET_USD       # whole-app daily AI spend cap
        value: "5"
      - key: FAIR_USE_MONTHLY_USD_PER_USER
        value: "10"

  - type: web
    name: newage-web-preview
    runtime: docker
    dockerfilePath: ./eco-web/Dockerfile
    dockerContext: ./eco-web
    region: frankfurt
    plan: starter
    numInstances: 1
    healthCheckPath: /login
    buildFilter:
      paths: [eco-web/**]
    envVars:
      - key: API_URL                   # host:port on the private network (server.ts adds http://)
        fromService: {name: newage-api-preview, type: pserv, property: hostport}
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_FORWARDED_FOR       # Render's proxy sets X-Forwarded-For
        value: "true"
      - key: NOINDEX                   # keep the preview out of search engines
        value: "true"
