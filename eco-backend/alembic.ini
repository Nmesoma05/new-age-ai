[alembic]
script_location = migrations
prepend_sys_path = .
# The database URL is read from MIGRATIONS_DATABASE_URL (owner role), never stored here.
# app_role is the non-owner role the API connects as; migrations grant it table access.
app_role = eco_app

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
